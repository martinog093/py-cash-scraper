name: Memphis Daily News Scraper

on:
  workflow_dispatch:   # always available for manual runs
    inputs:
      start_date:
        description: Start date YYYY-MM-DD (blank = 7 days ago)
        required: false
        default: ""
      end_date:
        description: End date YYYY-MM-DD (blank = today)
        required: false
        default: ""
  # schedule:
  #   - cron: '0 9 * * 1'   # Mondays 9:00 AM UTC (4:00 AM EST) — set schedule with Kash

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: |
          cd "Scraping job/MILESTONE 1 memphis-scraper"
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          MDN_USERNAME:    ${{ secrets.MDN_USERNAME }}
          MDN_PASSWORD:    ${{ secrets.MDN_PASSWORD }}
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        working-directory: "Scraping job/MILESTONE 1 memphis-scraper"
        run: |
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          if [ -n "$START" ] && [ -n "$END" ]; then
            xvfb-run -a python main.py "$START" "$END"
          else
            xvfb-run -a python main.py
          fi
