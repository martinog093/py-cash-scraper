name: Cash Buyer Scraper

on:
  workflow_dispatch:   # always available for manual runs
    inputs:
      shelby_zips:
        description: 'Shelby County ZIP codes (comma-separated; leave blank for all 41)'
        required: false
        default: ''
      days:
        description: Number of days back to scrape (default 7)
        required: false
        default: "7"
      min_price:
        description: Minimum sale price in USD (default 50000)
        required: false
        default: "50000"
      bergen_municipalities:
        description: 'Bergen County municipalities (comma-separated; leave blank for all 39)'
        required: false
        default: ''
  # schedule:
  #   - cron: '0 8 * * 0'   # Sundays 8:00 AM UTC (3:00 AM EST) — set schedule with Kash

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit buyer_history.db back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: |
          cd "Cash Buyer Scraper"
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        working-directory: "Cash Buyer Scraper"
        run: |
          ZIPS="${{ inputs.shelby_zips }}"
          DAYS="${{ inputs.days }}"
          MIN_PRICE="${{ inputs.min_price }}"
          BERGEN_MUNIS="${{ inputs.bergen_municipalities }}"
          CMD="xvfb-run -a python main.py --no-sheets"
          [ -n "$ZIPS" ] && CMD="$CMD --zips $ZIPS"
          [ -n "$DAYS" ] && CMD="$CMD --days $DAYS"
          [ -n "$MIN_PRICE" ] && CMD="$CMD --min-price $MIN_PRICE"
          [ -n "$BERGEN_MUNIS" ] && CMD="$CMD --bergen-municipalities \"$BERGEN_MUNIS\""
          eval $CMD

      - name: Persist buyer history DB
        working-directory: "Cash Buyer Scraper"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/buyer_history.db
          git diff --staged --quiet || git commit -m "chore: update buyer history [skip ci]"
          git pull --rebase origin main
          git push
